name: Release da bridge

# Quando uma release e publicada, compila a bridge para cada sistema e anexa os binarios e o
# SHA256SUMS a ela. A skill instalar-whatsapp baixa o binario certo e confere a soma, e quem
# instala nao precisa de Go nem de compilador C.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release que recebe os arquivos (por exemplo v0.1.1)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, goos: linux, goarch: amd64, arquivo: whatsapp-bridge-linux-amd64 }
          - { os: ubuntu-22.04-arm, goos: linux, goarch: arm64, arquivo: whatsapp-bridge-linux-arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64, arquivo: whatsapp-bridge-windows-amd64.exe }
          - { os: macos-14, goos: darwin, goarch: arm64, arquivo: whatsapp-bridge-darwin-arm64 }
          - { os: macos-14, goos: darwin, goarch: amd64, arquivo: whatsapp-bridge-darwin-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
      - name: Compilar
        working-directory: bridge
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Mac Intel no runner Apple Silicon: o clang compila para x86_64
          if [ "${{ matrix.goos }}-${{ matrix.goarch }}" = "darwin-amd64" ]; then
            export CC="clang -arch x86_64"
          fi
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w" -o "../dist/${{ matrix.arquivo }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arquivo }}
          path: dist/${{ matrix.arquivo }}
          if-no-files-found: error

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Somas SHA-256 e envio para a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum whatsapp-bridge-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" whatsapp-bridge-* SHA256SUMS --clobber --repo "${{ github.repository }}"
